# conf/slurm_kmeans.conf
#
# Dedicated config for perform_kmeans.sh's learn_kmeans.py step only.
# That step loads the entire training-pool feature set into memory before
# fitting (ESPnet's own comment on it: "It typically requires 120GB RAM to
# run kmeans steps"), which exceeds what the cpu/gpu partitions' per-CPU
# default memory (and their node RAM caps, ~128GB max) can reliably give.
# gpu-a100 nodes (e02-e05) have 1-2TB RAM, so we pin this one step there
# (no GPU actually used/requested by learn_kmeans.py, just borrowing the RAM).
command sbatch --export=ALL --ntasks-per-node=1 --nodes=1 --account=a100acct --partition=gpu-a100 --mem=200G
option time=* --time $0
option num_threads=* --cpus-per-task $0 --ntasks-per-node=1
option num_threads=1 --cpus-per-task 1  --ntasks-per-node=1
